# RefIQ application services.
# Requires infra first: docker compose -f docker-compose.infra.yml up -d
# Then: docker compose up --build
name: refiq

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ASSET_STORAGE_DIR: /data/assets
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUDIT_KAFKA_TOPIC: audit-events
      AUDIT_OUTBOX_ENABLED: "true"
    volumes:
      - assets_data:/data/assets
    ports:
      - "8000:8000"
    networks:
      - internal
      - external
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - internal
      - external
    restart: unless-stopped

  # Internal admin API. Same codebase as `api`, different entrypoint/process.
  # Bound to loopback so it is not published on the LAN like the public API.
  admin-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    entrypoint: ["./entrypoint-admin.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ASSET_STORAGE_DIR: /data/assets
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUDIT_KAFKA_TOPIC: audit-events
      AUDIT_OUTBOX_ENABLED: "true"
    volumes:
      - assets_data:/data/assets
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - internal
    restart: unless-stopped

  # Internal admin UI. Proxies /api to admin-api, never to the public api service.
  admin-front:
    build:
      context: ./admin-front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      - admin-api
    networks:
      - internal
    restart: unless-stopped

volumes:
  assets_data:
    name: app_assets_data

networks:
  internal:
    external: true
    name: refiq_internal
  external:
    driver: bridge
