services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ASSET_STORAGE_DIR: /data/assets
    volumes:
      - assets_data:/data/assets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - internal
      - external
    restart: unless-stopped

  # Internal admin API. Same codebase as `api`, different entrypoint/process.
  # Bound to loopback so it is not published on the LAN like the public API.
  admin-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    entrypoint: ["./entrypoint-admin.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ASSET_STORAGE_DIR: /data/assets
    volumes:
      - assets_data:/data/assets
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # Internal admin UI. Proxies /api to admin-api, never to the public api service.
  admin-front:
    build:
      context: ./admin-front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      - admin-api
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  assets_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
