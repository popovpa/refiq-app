# Databases and brokers for local RefIQ.
# Start first: docker compose -f docker-compose.infra.yml up -d
name: refiq-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    hostname: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./clickhouse/access-bootstrap:/bootstrap-access:ro
    # Official /entrypoint.sh requires users.default in users.xml; with SQL-only
    # users that key is absent, so we bootstrap access entities and start the server
    # directly. Image config.d/docker_related_config.xml still applies.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /var/lib/clickhouse/access /var/log/clickhouse-server
        if [ ! -f /var/lib/clickhouse/access/.refiq_sql_users_bootstrapped ]; then
          cp /bootstrap-access/*.sql /var/lib/clickhouse/access/
          touch /var/lib/clickhouse/access/need_rebuild_lists.mark
          touch /var/lib/clickhouse/access/.refiq_sql_users_bootstrapped
        fi
        chown -R clickhouse:clickhouse /var/lib/clickhouse /var/log/clickhouse-server
        exec clickhouse su clickhouse:clickhouse clickhouse-server --config-file=/etc/clickhouse-server/config.xml
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
    name: app_postgres_data
  redis_data:
    name: app_redis_data
  clickhouse_data:
    name: app_clickhouse_data

networks:
  internal:
    name: refiq_internal
    driver: bridge
