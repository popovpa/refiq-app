# Internal-only reverse proxy example for https://admin.int.refiq.ru
#
# Bind this vhost to the internal/VPN load balancer only.
# Do not attach it to the public ingress used by app.refiq.ru / api.refiq.ru.
#
# admin.int.refiq.ru/        -> admin-front
# admin.int.refiq.ru/api/*   -> admin backend (app.admin.app:app)

server {
    listen 443 ssl;
    server_name admin.int.refiq.ru;

    # ssl_certificate     /path/to/internal.crt;
    # ssl_certificate_key /path/to/internal.key;

    location /api/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /health {
        proxy_pass http://admin-api:8000/health;
    }

    location / {
        proxy_pass http://admin-front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
